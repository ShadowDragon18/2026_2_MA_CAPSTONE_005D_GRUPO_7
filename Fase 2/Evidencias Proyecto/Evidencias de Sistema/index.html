<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-exilus.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Exilus — sistema de gestión para consultas oftalmológicas."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Exilus — Gestión oftalmológica</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      try {
        var theme = localStorage.getItem('exilus.theme') || 'system'
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        var isDark = theme === 'dark' || (theme === 'system' && prefersDark)
        document.documentElement.classList.toggle('dark', isDark)
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light'
      } catch (error) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
